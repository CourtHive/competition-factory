name: Publish to npm

# Fires when a GitHub release is published. release-please creates
# releases via GITHUB_TOKEN, and `release: published` is delivered
# regardless of which token created it — unlike `push: tags`, which
# GitHub silently drops when triggered by GITHUB_TOKEN to prevent
# workflow loops. That gap is why v3.1.5 was tagged but never
# auto-published.
#
# `workflow_dispatch` is kept for manual backfill — pass a `tag`
# input (e.g. `v3.1.5`) to publish a tag that already exists.
#
# Two packages release from this repository, each with its own release PR and tag:
# tods-competition-factory as `vX.Y.Z`, and @courthive/competition-catalogue as
# `competition-catalogue-vX.Y.Z`. The tag decides which job runs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v3.1.5). Must already exist.'
        required: true
        type: string

jobs:
  publish:
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag, 'competition-catalogue-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # verify:verified-release reads the Verify runs that covered the tag's tree
      id-token: write
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0 # the gate reads the release commit's parents and when they landed

      # No `registry-url`. That input makes setup-node write an `.npmrc` whose
      # auth line is `_authToken=${NODE_AUTH_TOKEN}`, and nothing here sets that
      # variable: publishing is by OIDC (`id-token: write` above, `--provenance`
      # below), which npm trusted publishing exchanges for credentials itself.
      # pnpm reads the `.npmrc` on every invocation and warned about the unfilled
      # placeholder some twenty times per release — once per `verify:*` step —
      # while npm ignored it. The registry defaults to registry.npmjs.org.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: corepack enable

      # The package lives in packages/competition-factory: every step from the install to the
      # publish runs there. npm ignores pnpm-workspace.yaml, and the root package.json is a private
      # workspace root with no `workspaces` field, so this installs the package's own dependencies
      # (layout move decision 3: keep `npm install`; the pinned pnpm setup is a separate change).
      # A pre-move tag has no packages/ directory, so a workflow_dispatch backfill of one fails.
      - run: npm install --legacy-peer-deps --ignore-scripts
        working-directory: packages/competition-factory

      - run: npm run lint
        working-directory: packages/competition-factory

      - run: npm run check-types
        working-directory: packages/competition-factory

      - run: npm run build
        working-directory: packages/competition-factory

      # The tag-time gate PROVES the tree was verified instead of re-testing it.
      # `prepublishOnly` (= `pinst --disable && pnpm verify`) re-ran the whole chain here, ~45 min on
      # one runner, on a tree the checkpoint into master had just verified. A release commit changes
      # only the version files, so verify:verified-release checks exactly that, and that a `Verify`
      # run with `verify:coverage` green covered its parent: the checkpoint PR's own run, or the push
      # run on master, which it waits for when it must. An unverified tree is never published.
      # `prepublishOnly` still guards a manual local publish; this job publishes with
      # --ignore-scripts after running the fast release gates itself.
      - name: The tag's tree was verified
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: packages/competition-factory
        run: node scripts/verify/verified-release.mjs --wait 90

      - name: verify:release (generated, lockfile, build, publint, runtime, shakeable, bundle-size, consumer-bundle, surface, pack)
        working-directory: packages/competition-factory
        run: pnpm verify:release

      - name: Determine npm dist-tag
        id: distTag
        run: |
          VERSION="${{ steps.ref.outputs.version }}"
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npx pinst --disable
        working-directory: packages/competition-factory

      - run: npm publish --ignore-scripts --provenance --access public --tag ${{ steps.distTag.outputs.tag }}
        working-directory: packages/competition-factory

  publish-catalogue:
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'competition-catalogue-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: corepack enable

      # The catalogue's declarations are checked against the factory's type files, so the workspace installs whole.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # check-types, build, and the built package's contents (scripts/verify-dist.mjs)
      - run: pnpm verify
        working-directory: packages/competition-catalogue

      - run: npm publish --ignore-scripts --provenance --access public
        working-directory: packages/competition-catalogue
