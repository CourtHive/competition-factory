name: Publish to npm

# Fires when a GitHub release is published. release-please creates
# releases via GITHUB_TOKEN, and `release: published` is delivered
# regardless of which token created it — unlike `push: tags`, which
# GitHub silently drops when triggered by GITHUB_TOKEN to prevent
# workflow loops. That gap is why v3.1.5 was tagged but never
# auto-published.
#
# `workflow_dispatch` is kept for manual backfill — pass a `tag`
# input (e.g. `v3.1.5`) to publish a tag that already exists.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v3.1.5). Must already exist.'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # verify:verified-release reads the Verify runs that covered the tag's tree
      id-token: write
    steps:
      - name: Resolve tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0 # the gate reads the release commit's parents and when they landed

      # No `registry-url`. That input makes setup-node write an `.npmrc` whose
      # auth line is `_authToken=${NODE_AUTH_TOKEN}`, and nothing here sets that
      # variable: publishing is by OIDC (`id-token: write` above, `--provenance`
      # below), which npm trusted publishing exchanges for credentials itself.
      # pnpm reads the `.npmrc` on every invocation and warned about the unfilled
      # placeholder some twenty times per release — once per `verify:*` step —
      # while npm ignored it. The registry defaults to registry.npmjs.org.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - run: npm install --legacy-peer-deps --ignore-scripts

      - run: npm run lint

      - run: npm run check-types

      - run: npm run build

      # The tag-time gate PROVES the tree was verified instead of re-testing it (CA, 2026-10-04).
      # `prepublishOnly` (= `pinst --disable && pnpm verify`) re-ran the whole chain here, ~45 min on
      # one runner, on a tree the checkpoint into master had just verified. A release commit changes
      # only the version files, so verify:verified-release checks exactly that, and that a `Verify`
      # run with `verify:coverage` green covered its parent: the checkpoint PR's own run, or the push
      # run on master, which it waits for when it must. An unverified tree is never published.
      # `prepublishOnly` still guards a manual local publish; this job publishes with
      # --ignore-scripts after running the fast release gates itself.
      - name: The tag's tree was verified
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify/verified-release.mjs --wait 90

      - name: verify:release (generated, lockfile, build, publint, runtime, shakeable, bundle-size, surface, pack)
        run: pnpm verify:release

      - name: Determine npm dist-tag
        id: distTag
        run: |
          VERSION="${{ steps.ref.outputs.version }}"
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npx pinst --disable

      - run: npm publish --ignore-scripts --provenance --access public --tag ${{ steps.distTag.outputs.tag }}
