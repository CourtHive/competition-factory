name: Verify

# Runs the full verification suite on every PR + push to master. The `verify`
# script is also wired into `prepublishOnly`, so this acts as the canary —
# any check that fails here will also block publish, but here we catch it
# at PR time instead of at release-tag time.
#
# Ecosystem sweep is intentionally NOT run in CI here — sibling consumer
# repos aren't checked out. Maintainers run `pnpm verify:ecosystem` locally
# when needed. CI tests the factory in isolation across the supported Node
# matrix.
#
# LAYOUT (2026-10-05). The gates used to run in ONE job per Node version, in sequence, and
# verify:coverage alone took ~38 min of a 30-59 min dev PR run (~70 min at a checkpoint). They now run
# as parallel jobs, each once per Node version as before:
#
#   scope           decides the release-path light run (.github/scripts/release-scope.sh)
#   gates           the cheap gates, verify:server and the build chain, in their old order
#   coverage-shard  the coverage run split 4 ways (vitest --shard), each writing a blob report
#   coverage        merges the 4 blobs (vitest --merge-reports --coverage): the thresholds and
#                   coverage/coverage-summary.json are computed over the MERGED result
#   slow-gates      route-differential, double-exit-sweep, deep-corrections and hydrations, one job each
#   team-arms       verify:team-arms split 5 ways (vitest --shard), nineteen strictly selected TEAM files, once
#                   under OUTCOME_PIPELINE=v1 and once under v2
#   pipeline-arm    the suite under the outcome pipeline the coverage run does not run alone, split 4 ways: the
#                   v1 fallback into dev (coverage runs v2, the default), v2 on the path to a release (coverage
#                   runs the differential, whose applied writes are v1's)
#   differential-arm the suite under OUTCOME_PIPELINE=differential on a dev PR touching the outcome pipeline, split
#                   4 ways: a divergence between v1 and v2 fails it (into master the coverage shards run it). Its
#                   audit leg runs it again with the notice payload detector compiled in, also when the notice
#                   delivery paths change: a write through a payload fails it (notice payloads are read-only)
#   verify          `verify (node N)`, the check master's branch protection requires: it passes only
#                   when every job above passed (or, on a light run, was skipped as intended)
#
# TIMEOUTS (2026-10-17). Every job sets `timeout-minutes`. GitHub's default is 360, so a runner that hangs
# after its tests pass holds the run for hours: on 2026-10-07 the 7.7.0 checkpoint's team-arms job passed
# its tests in 22 minutes and then sat in the setup action's post step (the pnpm store cache save) for
# over 70. Each limit is about twice the slowest run measured over the last 20 successful runs (PRs into
# dev, and checkpoints under OUTCOME_PIPELINE=differential), so a timeout means a hang, not a slow day.
# A timed-out job fails while its own result is fresh, and `gh run rerun --failed` is one command.

on:
  pull_request:
  push:
    branches: [master]
  # Manual runs exercise the checkpoint path on the selected ref: full matrices and differential coverage.
  workflow_dispatch:
    inputs:
      coverage-workers:
        description: Coverage worker experiment; default preserves the normal runner policy
        type: choice
        default: default
        options: [default, '2', '4']

permissions:
  contents: read

# Opt JavaScript actions (e.g. actions/cache) into Node 24 before
# GitHub's June 16 2026 forced cutover; silences the Node-20 deprecation
# warning today and de-risks the runner-side migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FACTORY_COVERAGE_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-workers || 'default' }}
  # MATRIX TIERS (2026-11-05; src/tests/testHarness/matrixTier.ts). An ordinary PR into dev runs a bounded,
  # stratified slice of the heavy exit-propagation matrices; a checkpoint PR into master, a push to master and a
  # manual dispatch run them in full. Only a pull_request whose base is not master gets `pr`: anything else, an
  # unset variable included, is the full run.
  FACTORY_MATRIX_TIER: ${{ (github.event_name == 'pull_request' && github.base_ref != 'master') && 'pr' || 'full' }}

jobs:
  # A release-please PR (into master) or the back-merge PR (master into dev, after a publish) changes
  # only the version files: package.json's "version" line, CHANGELOG.md and
  # .release-please-manifest.json. The tree under it was verified when it landed, so the heavy test
  # jobs have nothing new to test, and they cost ~55 minutes per release. Decided by
  # the DIFF, not the branch name: a release-path PR that touches anything else gets the full run.
  # The `gates` job and the aggregating `verify` job always run, because master requires the
  # `verify (node 26)` check; the cheap gates plus the build chain still run.
  scope:
    timeout-minutes: 10
    # Skip when the head commit is the release-please bot's release-PR
    # merge. Release-please PRs touch only CHANGELOG.md, package.json
    # (version bump), and .release-please-manifest.json — never any
    # tested source. The same tree was verified when the checkpoint
    # landed on master, so re-running the full matrix here adds CI for no
    # new signal. Every other job needs this one, so they skip with it.
    #
    # PR events (which the bot opens before merging) always run, but skip the
    # heavy test jobs when the diff is the version files alone; the resulting
    # merge push is skipped. npm-publish.yml then proves the tree was verified
    # (verify:verified-release) rather than re-running the chain.
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'release-please--branches--')
    runs-on: ubuntu-latest
    outputs:
      light: ${{ steps.scope.outputs.light }}
    steps:
      - uses: actions/checkout@v7
        with:
          # release-scope.sh diffs the PR's merge commit against its first parent, the base tip.
          fetch-depth: 2

      # Refs and repository names reach the script through env, never inlined into the shell:
      # a branch name is chosen by whoever opens the PR.
      - name: Release-path scope
        id: scope
        run: bash .github/scripts/release-scope.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}

  gates:
    needs: scope
    # slowest measured: 6 min
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The package lives in packages/competition-factory; the repo root is the pnpm workspace root.
    defaults:
      run:
        working-directory: packages/competition-factory
    strategy:
      fail-fast: false
      matrix:
        # Node 26 only, PRs and pushes alike: it is what the deploy hosts run. The Node 24 leg (the
        # `engines: ">=24"` floor) was dropped 2026-10-31 for the CI time it cost.
        node-version: [26]
    name: gates (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7
        with:
          # verify:migration-coverage diffs against the last release TAG. A shallow checkout has
          # neither the tag nor the history, and the check errors rather than passing quietly — so
          # this is a precondition, not a nicety.
          fetch-depth: 0

      # A pnpm that does not match this repo's `packageManager` pin writes an `@pnpm/exe` block
      # into the lockfile; a pnpm that DOES match strips it out again. Committed, it makes every
      # correctly-provisioned checkout permanently dirty and drowns real work in `git status`. It was
      # cleaned out of six repos on 2026-09-08 and reappeared in two working trees the same
      # afternoon, so the committed state needs a guard rather than vigilance.
      #
      # The pattern excludes `@pnpm/exe.<platform>` — those are legitimate optional deps of `pnpm`
      # itself and every clean lockfile holds 24 of them, so the obvious grep fails every repo.
      - name: Lockfiles must not carry an @pnpm/exe block
        # every tracked lockfile in the repo, so this step runs from the root, not the package
        working-directory: .
        run: |
          locks=$(git ls-files '*pnpm-lock.yaml')
          if [ -z "$locks" ]; then
            echo "::error::no tracked pnpm-lock.yaml found — this check would pass vacuously"
            exit 1
          fi
          echo "checked $(printf '%s\n' "$locks" | wc -l) tracked lockfile(s)"
          bad=0
          while IFS= read -r f; do
            if grep -qE "@pnpm/exe[^.]" "$f"; then
              echo "::error file=$f::$f carries an @pnpm/exe block, written only by a pnpm that does not match this repo's packageManager pin. Reinstall with the pinned pnpm and commit the lockfile."
              bad=1
            fi
          done <<LOCKS
          $locks
          LOCKS
          exit $bad

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # In-CI verify minus the ecosystem sweep (siblings aren't here).
      # Order: cheap fail-fast → expensive checks last.
      #
      # verify:generated runs first: it re-runs the three code generators in
      # --check mode, so drift between a hand-edited source enum/method and its
      # generated mirror fails here with an explicit "run `pnpm gen:X`" message
      # instead of surfacing later as an opaque conformance/type error. Note it
      # cannot be left to `verify:build` — that invokes rollup directly, and the
      # `prebuild` hook (which regenerates rather than checks) never fires.
      - name: verify:generated
        run: pnpm verify:generated

      # CI only, not in verify:generated (which also runs at pre-commit): it bundles each exported engine
      # with esbuild (~1.2 s) to keep the hosting guide's per-engine governor table true to the code.
      - name: verify:engine-governors
        run: pnpm verify:engine-governors

      - name: Verify shard timing tooling
        run: |
          node --test scripts/shardTiming.test.mjs
          node --test scripts/importHeaderPattern.test.mjs
          pnpm exec vitest run src/tests/global/childProcessDeadline.test.ts --maxWorkers=2

      - name: verify:types
        run: pnpm verify:types

      # The catalogue package (packages/competition-catalogue): its types, its build, and the built package's
      # contents. The factory's tests read the catalogue's source, so this is the only gate on its build.
      - name: verify:catalogue
        run: pnpm verify:catalogue

      - name: verify:lint
        run: pnpm verify:lint

      # Scoped to the TS/JS sources the repo actually keeps formatted, PLUS the
      # markdown under documentation/docs (added 2026-09-18). The .codes.json
      # fixtures under src/tests remain deliberately OUT of scope: reformatting
      # them is a ~40k-line diff across large test corpora and buries their
      # blame for no benefit. `format` carries the same target set, so it and
      # this gate can never disagree.
      #
      # Why documentation/docs joined: nothing checked formatting there, so 19
      # files had been prettier-dirty for a long time invisibly. lint-staged's
      # `*` glob reformats any staged file, so that debt surfaced only when
      # someone touched one of those files -- and then rode out on their
      # unrelated commit. It nearly buried a mechanical link fix under 670
      # removed / 1068 added lines of JSX re-indentation (#4918).
      - name: verify:format
        run: pnpm verify:format

      # The layer ratchet (the `LAYERS` table in scripts/verify/layers.mjs): an import into a higher layer fails
      # unless the baseline holds it, and a baseline entry the source no longer has fails too, so the
      # baseline only goes down. Self-tested first: it must fire on planted violations.
      - name: verify:layers
        run: pnpm verify:layers

      # THE EXIT TENANT'S REGROWTH GUARD. `matchUpStatusCodes` carried the per-side provenance of a propagated exit
      # as well as the scoring policy's vocabulary; the exit tenant is evicted and `sideExitProvenance`
      # is the record. This fails when a NEW file in `src/` reaches for the array, so the destination is
      # enforceable rather than aspirational.
      #
      # Enumerated HERE as well as in the `verify` chain deliberately: this workflow runs the steps
      # individually rather than invoking `pnpm verify`, so a chain-only entry would be a gate that runs
      # on every developer's machine and never once in CI.
      - name: verify:exit-tenant
        run: pnpm verify:exit-tenant

      # every name outcome v2 decides by (its routes, its refusal rows) is stated in the spec a port
      # follows (outcome v2 executor plan G5)
      - name: verify:outcome-spec
        run: pnpm verify:outcome-spec

      # the golden corpus hash manifest: a behaviour change moves a hash, and a moved hash needs
      # a deliberate `pnpm corpus:manifest` in the same PR
      - name: verify:corpus-manifest
        run: pnpm verify:corpus-manifest

      # WIRED IN 2026-09-13, and the `fetch-depth: 0` above was already here FOR it — the checkout
      # comment names this gate by name. It was left out of CI because it read `(#PR)` from the
      # commit subject, which only exists after a squash-merge, so it could never pass on a PR
      # branch. That had two costs: migration-guide coverage was enforced only at `prepublishOnly`,
      # after the fact; and anyone running `pnpm verify` locally hit an unpassable check and worked
      # around it by typing the number into the subject, which the squash then DOUBLED — #4827,
      # #4855 and #4858 all carry `(#NNNN) (#NNNN)` into the 7.0.0 changelog.
      #
      # The script now reads the number from GITHUB_REF on a pull_request build, so it passes on a
      # PR branch and the workaround is unnecessary. Running it here is what makes the gate a gate.
      - name: verify:migration-coverage
        run: pnpm verify:migration-coverage

      - name: verify:attr-audit
        run: pnpm verify:attr-audit

      # Seconds, not minutes, so it stays here rather than in its own job; skipped on a light run like
      # the other test gates.
      - name: verify:server
        if: needs.scope.outputs.light != 'true'
        run: pnpm verify:server

      - name: verify:audit
        run: pnpm verify:audit

      - name: verify:build
        run: pnpm verify:build

      # The read-only notice payload detector (notice payloads are read-only), compiled out of the dist verify:build just made: the
      # standalone audit build rejects a write the published build delivers raw, and the focused write checks run
      # with the detector compiled in (NOTICE_PAYLOAD_WRITE_CHECK=1). The whole suite runs that way in the
      # differential arm's audit leg.
      - name: verify:notice-diagnostics
        run: pnpm verify:notice-diagnostics

      - name: verify:publint
        run: pnpm verify:publint

      - name: verify:runtime
        run: pnpm verify:runtime

      # Reads dist/esm/index.mjs, so it must follow verify:build. Kept in the
      # same position as the `verify` chain (runtime → shakeable → bundle-size).
      - name: verify:shakeable
        run: pnpm verify:shakeable

      - name: verify:bundle-size
        run: pnpm verify:bundle-size

      - name: verify:consumer-bundle
        run: pnpm verify:consumer-bundle

      # Needs dist. `tods-competition-factory/score-entry-state` reaches only score-entry and scoring code: no engine,
      # global engine state, async_hooks, DOM or root barrel, in source, in the built ESM and CJS, and in its .d.ts.
      - name: verify:score-entry-state
        run: pnpm verify:score-entry-state

      # The constants-only package graph must stay independent of the tournament engine.
      - name: verify:constants
        run: pnpm verify:constants

      - name: verify:surface
        run: pnpm verify:surface

      # Needs dist, so it sits after verify:build. Packs it, counts the @deprecated tags postbuild.mjs injected into
      # every shipped declaration file against the transition manifest, the positional guard list and the alias
      # list (missing or unexpected fails), then runs the editor probe (TypeScript language service) on the tarball.
      - name: verify:deprecations
        run: pnpm verify:deprecations

      # The declaration-diff gate of the type-graph split. It fingerprints
      # every export of the three published declaration bundles and compares them with the PR's merge base, which it
      # builds here in a throwaway worktree that borrows this job's node_modules (~10 s for both builds; this job has
      # ~30 min of slack against the coverage shards). Its self-test always fails hard.
      #
      # REQUIRED on a type-split PR, INFORMATIONAL (job summary only, never failing) on every other PR. The switch
      # is the head branch: a PR from a `type-split/...` branch is a type-split PR. A branch name is fixed when the
      # run starts and cannot go stale; a `type-split` label would need `labeled` in this workflow's pull_request
      # types (re-running every job on any label) and would be missed if added after the last push.
      - name: verify:declarations
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mode=informational
          case "$HEAD_REF" in type-split/*) mode=required ;; esac
          echo "verify:declarations mode: $mode"
          pnpm verify:declarations --base "origin/$BASE_REF" --mode "$mode"

      # Public text (documentation/**, the READMEs, the CHANGELOG) states rules, not who decided them: no
      # attribution to a person's rulings, no ruling, plan or finding ids, no pointers into the private planning
      # repository. Needs no build; its self-test runs first and fails hard.
      - name: verify:docs-provenance
        run: pnpm verify:docs-provenance

      # The same rules for everything else tracked: comments, JSDoc and test titles in src/, scripts/, .github/ and
      # .husky/ (separated from code by TypeScript's scanner), runtime string literals that reach callers, and the
      # remaining plain-text files. Needs no build; its self-test runs first and fails hard.
      - name: verify:source-provenance
        run: pnpm verify:source-provenance

      # Needs dist, so it sits after verify:build. Checks that every import the docs tell a
      # reader to write actually resolves against the BUILT package — the documentation tests
      # import by module path and so cannot see a public-surface break.
      - name: verify:docs-imports
        run: pnpm verify:docs-imports

      # The imports check proves the IMPORT resolves; it says nothing about what is then CALLED. A doc
      # can import tournamentEngine correctly and invoke a method that has never existed.
      - name: verify:docs-methods
        run: pnpm verify:docs-methods

      # Strict, executed examples from the actual doc fences (verify:docs-model runs in verify:generated).
      - name: verify:docs-examples
        run: pnpm verify:docs-examples

      # Every documented mocksEngine.generateTournamentRecord fence, run as written: it must not throw, and no
      # generation in it may return an error it does not document (`// result.error -> CODE`).
      - name: verify:docs-mock-examples
        run: pnpm verify:docs-mock-examples

      - name: verify:pack
        run: pnpm verify:pack

  # On the path to a release (a PR into master, or a push to master) coverage runs the WHOLE suite
  # under OUTCOME_PIPELINE=differential: every call runs v1 and the v2 outcome pipeline, both are
  # measured where they execute, and a divergence between them fails the job. Into dev the suite
  # runs under OUTCOME_PIPELINE=v2, the engine's default since the flip (Path A step 3), and v2 is
  # measured there too (vitest.config.mts leaves it out only under v1). Named rather than left to
  # the engine's default: what coverage measures does not move when that default does. The v1
  # fallback, kept through 7.x, runs in `pipeline-arm`.
  #
  # The suite runs as 4 shards. A shard's own coverage is partial, so vitest.config.mts drops the
  # thresholds on a `--shard` run; the shard fails only on a failing test (a differential divergence
  # is one). Its coverage travels in the blob report to the `coverage` job, which applies them.
  coverage-shard:
    needs: scope
    if: needs.scope.outputs.light != 'true'
    # slowest measured: 29 min (a checkpoint, under the differential)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The package lives in packages/competition-factory; the repo root is the pnpm workspace root.
    defaults:
      run:
        working-directory: packages/competition-factory
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates`
        node-version: [26]
        shard: [1, 2, 3, 4]
    name: coverage shard ${{ matrix.shard }}/4 (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: coverage shard ${{ matrix.shard }}/4
        run: |
          workers=()
          case "$FACTORY_COVERAGE_WORKERS" in
            default) ;;
            2|4) workers=(--maxWorkers="$FACTORY_COVERAGE_WORKERS") ;;
            *) echo "::error::unsupported coverage worker count"; exit 1 ;;
          esac
          pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob --reporter=./scripts/shardTimingReporter.mjs "${workers[@]}"
        env:
          OUTCOME_PIPELINE: ${{ (github.event_name == 'workflow_dispatch' || github.base_ref == 'master' || github.ref == 'refs/heads/master') && 'differential' || 'v2' }}

      # `.vitest/blob/blob-<shard>-4.json` (vitest's default); a dot-directory, hence include-hidden-files
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-node${{ matrix.node-version }}-${{ matrix.shard }}
          path: packages/competition-factory/.vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: coverage-timing-node${{ matrix.node-version }}-${{ matrix.shard }}
          path: packages/competition-factory/.vitest/timing/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  coverage:
    needs: [scope, coverage-shard]
    if: needs.scope.outputs.light != 'true'
    # merges the shard reports; under a minute
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The package lives in packages/competition-factory; the repo root is the pnpm workspace root.
    defaults:
      run:
        working-directory: packages/competition-factory
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates`
        node-version: [26]
    name: coverage (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-blob-node${{ matrix.node-version }}-*
          path: packages/competition-factory/.vitest/blob
          merge-multiple: true

      # The step NAME is load-bearing: scripts/verify/verified-release.mjs accepts a run as proof only
      # if a step named exactly `verify:coverage` succeeded in it. This step is where the thresholds
      # (vitest.config.mts) are applied, to the merged coverage of all 4 shards, so it is the step the
      # name means. It loads the same config, so it needs the same OUTCOME_PIPELINE as the shards: that
      # env decides whether src/mutate/matchUps/outcome/** is in the measured set.
      - name: verify:coverage
        id: coverage_verification
        run: |
          count=$(find .vitest/blob -name 'blob-*.json' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 shard blob reports, found $count"
            exit 1
          fi
          pnpm exec vitest run --merge-reports=.vitest/blob --coverage --reporter=default
        env:
          OUTCOME_PIPELINE: ${{ (github.event_name == 'workflow_dispatch' || github.base_ref == 'master' || github.ref == 'refs/heads/master') && 'differential' || 'v2' }}

      # How much margin the merged coverage has above the floors, in items (a report plus an
      # absolute minimum). Written to the job summary on every run, and the run fails if any metric
      # has fewer than 50 items of headroom: early warning, well before the thresholds fail at 0. Report
      # mode skips the committed-baseline budget, which local `pnpm verify` still applies.
      - name: verify:coverage-headroom
        run: node scripts/verify/coverage-headroom.mjs --report --min=50

      # Timing observations are informational. They never alter weights or coverage verdicts in CI.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: coverage-timing-node${{ matrix.node-version }}-*
          path: packages/competition-factory/.vitest/timing
          merge-multiple: true

      - name: Report shard duration drift
        continue-on-error: true
        run: node scripts/shardTiming.mjs report .vitest/timing coverage/shard-timing.json
        env:
          COVERAGE_VERIFIED: ${{ steps.coverage_verification.outcome == 'success' }}

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: coverage-duration-observations-node${{ matrix.node-version }}
          path: |
            packages/competition-factory/coverage/shard-timing.json
            packages/competition-factory/coverage/shard-timing.json.md
          if-no-files-found: warn
          retention-days: 14

      # coverage/coverage-summary.json of the merged run, so anyone can re-run the headroom against it.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-summary-node${{ matrix.node-version }}
          path: packages/competition-factory/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  slow-gates:
    needs: scope
    if: needs.scope.outputs.light != 'true'
    # slowest measured: 13 min (deep-corrections)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The package lives in packages/competition-factory; the repo root is the pnpm workspace root.
    defaults:
      run:
        working-directory: packages/competition-factory
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates`
        node-version: [26]
        gate: [route-differential, double-exit-sweep, deep-corrections, hydrations]
    name: ${{ matrix.gate }} (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: verify:${{ matrix.gate }}
        run: pnpm verify:${{ matrix.gate }}

  # THE PIPELINE ARM (Path A step 3, the flip). The whole suite under the outcome pipeline the coverage run does not
  # run alone, so every tier runs the default (v2) alone, the v1 fallback's writes, and the differential:
  # - into dev, coverage runs v2 (the default), and this arm runs the v1 fallback, kept selectable through 7.x, so it
  #   cannot rot unseen before it is removed. It replaces the informational v2 arm, which ran v2 while v1 was the
  #   default. It is REQUIRED and runs on every heavy run, not only on outcome paths: v1 was the gated suite on every
  #   dev PR until the flip, and a change outside the outcome paths (mocks, policies, queries) can break it.
  # - on the path to a release, coverage runs the differential, whose applied writes are v1's, so this arm runs v2,
  #   the default production runs, alone.
  # SHARDED 4 ways, as coverage is (the v2 arm as one job took 33-34 min, #5909 and #5910).
  pipeline-arm:
    needs: scope
    if: needs.scope.outputs.light != 'true'
    # slowest measured as ONE job (the v2 arm): 34 min; a shard is a quarter of that
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The package lives in packages/competition-factory; the repo root is the pnpm workspace root.
    defaults:
      run:
        working-directory: packages/competition-factory
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: pipeline-arm ${{ matrix.shard }}/4
    env:
      # the complement of `coverage-shard`'s OUTCOME_PIPELINE: v1 where coverage runs v2, v2 where it runs the differential
      OUTCOME_PIPELINE: ${{ (github.event_name == 'workflow_dispatch' || github.base_ref == 'master' || github.ref == 'refs/heads/master') && 'v2' || 'v1' }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: 26

      - name: vitest under OUTCOME_PIPELINE=${{ env.OUTCOME_PIPELINE }}, shard ${{ matrix.shard }}/4
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  # The differential on a dev PR: every call runs v1 and the v2 outcome pipeline, and a divergence between them (a
  # write, a notice, a decision) fails the shard. Into master the coverage shards run the whole suite this way; into
  # dev they run v2 alone, so before this arm a divergence a dev PR introduced surfaced only at the next checkpoint
  # (outcome v2 executor plan, S7). It runs on the outcome pipeline's paths only.
  differential-arm:
    needs: scope
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.scope.outputs.light != 'true'
    # the differential runs both pipelines: measured as the whole suite on Lenz, about twice the default run
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # The package lives in packages/competition-factory; the repo root is the pnpm workspace root.
    defaults:
      run:
        working-directory: packages/competition-factory
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        # audit: the same run with the read-only notice payload detector compiled in (NOTICE_PAYLOAD_WRITE_CHECK=1)
        leg: [plain, audit]
    name: differential-arm ${{ matrix.shard }}/4 ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: touches the outcome pipeline
        id: paths
        # `git diff --name-only` prints repo-root paths wherever it runs, hence the package prefix. The audit leg also
        # runs when notice delivery changes: the global state, the notices, the preview copier or the detector itself.
        env:
          LEG: ${{ matrix.leg }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^packages/competition-factory/src/(mutate/(matchUps|drawDefinitions/positionGovernor|drawDefinitions/matchUpGovernor)|query/(matchUps|matchUp|drawDefinition))/' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LEG" = audit ] && grep -qE '^packages/competition-factory/(src/(global/state|mutate/notifications)/|src/forge/previewState\.ts|scripts/noticeDiagnostics/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no outcome pipeline path changed; the differential arm's $LEG leg does not run"
          fi

      - if: steps.paths.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: 26

      - name: vitest under OUTCOME_PIPELINE=differential, shard ${{ matrix.shard }}/4, ${{ matrix.leg }}
        if: steps.paths.outputs.run == 'true'
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4
        env:
          OUTCOME_PIPELINE: differential
          NOTICE_PAYLOAD_WRITE_CHECK: ${{ matrix.leg == 'audit' && '1' || '' }}
          TZ: UTC

  # verify:team-arms: the TEAM matrix over the seven extension draw types and more tieFormats, inert on
  # `pnpm test` (2026-10-05). As one job it was the slowest in the run (up to 30 min, 2026-10). vitest
  # --shard splits nineteen TEAM files across the existing five jobs; the explicit file list stays in
  # package.json alone: a file added there lands in some shard without touching this workflow. A shard
  # that receives no file fails (vitest exits 1 on "No test files found"), so raise the count only when
  # the file count grows past it.
  #
  # Each shard runs twice, under OUTCOME_PIPELINE=v1 (the fallback) and under v2 (the default), both named
  # rather than left to the engine's default. The TEAM arms are inert in every other suite run, so this is the
  # only job that runs them; under the differential v1's writes are the ones applied.
  team-arms:
    needs: scope
    if: needs.scope.outputs.light != 'true'
    # slowest measured as ONE job: 30 min; a shard is one file of that
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # The package lives in packages/competition-factory; the repo root is the pnpm workspace root.
    defaults:
      run:
        working-directory: packages/competition-factory
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates`
        node-version: [26]
        shard: [1, 2, 3, 4, 5]
        pipeline: [v1, v2]
    name: team-arms ${{ matrix.shard }}/5 ${{ matrix.pipeline }} (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: verify:team-arms ${{ matrix.shard }}/5 under OUTCOME_PIPELINE=${{ matrix.pipeline }}
        run: pnpm verify:team-arms --shard=${{ matrix.shard }}/5
        env:
          OUTCOME_PIPELINE: ${{ matrix.pipeline }}

  # The check master's branch protection requires is `verify (node 26)`, and this job is it. It
  # passes only when every other job passed, except that on a light run the heavy jobs must have been
  # SKIPPED (any other result, cancelled included, fails it). It runs whatever its needs did, so a red
  # job still produces a red `verify (node N)` rather than a missing one.
  verify:
    needs: [scope, gates, coverage-shard, coverage, slow-gates, team-arms, pipeline-arm, differential-arm]
    if: >
      always() && (
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, 'release-please--branches--')
      )
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates`
        node-version: [26]
    name: verify (node ${{ matrix.node-version }})

    steps:
      - name: Every verify job passed
        env:
          LIGHT: ${{ needs.scope.outputs.light }}
          SCOPE: ${{ needs.scope.result }}
          GATES: ${{ needs.gates.result }}
          SHARDS: ${{ needs.coverage-shard.result }}
          COVERAGE: ${{ needs.coverage.result }}
          SLOW: ${{ needs.slow-gates.result }}
          TEAM: ${{ needs.team-arms.result }}
          PIPELINE_ARM: ${{ needs.pipeline-arm.result }}
          DIFFERENTIAL: ${{ needs.differential-arm.result }}
          DEV_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
        run: |
          heavy=success
          if [ "$LIGHT" = true ]; then heavy=skipped; fi
          # the differential arm runs on a dev PR alone (into master the coverage shards run the differential)
          differential=skipped
          if [ "$DEV_PR" = true ] && [ "$LIGHT" != true ]; then differential=success; fi
          bad=0
          check() {
            if [ "$2" = "$3" ]; then echo "ok    $1: $2"; else echo "::error::$1: $2 (expected $3)"; bad=1; fi
          }
          check scope "$SCOPE" success
          check gates "$GATES" success
          check coverage-shard "$SHARDS" "$heavy"
          check coverage "$COVERAGE" "$heavy"
          check slow-gates "$SLOW" "$heavy"
          check team-arms "$TEAM" "$heavy"
          check pipeline-arm "$PIPELINE_ARM" "$heavy"
          check differential-arm "$DIFFERENTIAL" "$differential"
          exit $bad
