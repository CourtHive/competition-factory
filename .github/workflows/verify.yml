name: Verify

# Runs the full verification suite on every PR + push to master. The `verify`
# script is also wired into `prepublishOnly`, so this acts as the canary —
# any check that fails here will also block publish, but here we catch it
# at PR time instead of at release-tag time.
#
# Ecosystem sweep is intentionally NOT run in CI here — sibling consumer
# repos aren't checked out. Maintainers run `pnpm verify:ecosystem` locally
# when needed. CI tests the factory in isolation across the supported Node
# matrix.
#
# LAYOUT (CA, 2026-10-05). The gates used to run in ONE job per Node version, in sequence, and
# verify:coverage alone took ~38 min of a 30-59 min dev PR run (~70 min at a checkpoint). They now run
# as parallel jobs, each once per Node version as before:
#
#   scope           decides the release-path light run (.github/scripts/release-scope.sh)
#   gates           the cheap gates, verify:server and the build chain, in their old order
#   coverage-shard  the coverage run split 4 ways (vitest --shard), each writing a blob report
#   coverage        merges the 4 blobs (vitest --merge-reports --coverage): the thresholds and
#                   coverage/coverage-summary.json are computed over the MERGED result
#   slow-gates      stall-budget, route-differential and deep-corrections, one job each
#   verify          `verify (node N)`, the check master's branch protection requires: it passes only
#                   when every job above passed (or, on a light run, was skipped as intended)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Opt JavaScript actions (e.g. actions/cache) into Node 24 before
# GitHub's June 16 2026 forced cutover; silences the Node-20 deprecation
# warning today and de-risks the runner-side migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A release-please PR (into master) or the back-merge PR (master into dev, after a publish) changes
  # only the version files: package.json's "version" line, CHANGELOG.md and
  # .release-please-manifest.json. The tree under it was verified when it landed, so the heavy test
  # jobs have nothing new to test, and they cost ~55 minutes per release (CA, 2026-10-04). Decided by
  # the DIFF, not the branch name: a release-path PR that touches anything else gets the full run.
  # The `gates` job and the aggregating `verify` job always run, because master requires the
  # `verify (node 24)` check; the cheap gates plus the build chain still run.
  scope:
    # Skip when the head commit is the release-please bot's release-PR
    # merge. Release-please PRs touch only CHANGELOG.md, package.json
    # (version bump), and .release-please-manifest.json — never any
    # tested source. The same tree was verified when the checkpoint
    # landed on master, so re-running the full matrix here adds CI for no
    # new signal. Every other job needs this one, so they skip with it.
    #
    # PR events (which the bot opens before merging) always run, but skip the
    # heavy test jobs when the diff is the version files alone; the resulting
    # merge push is skipped. npm-publish.yml then proves the tree was verified
    # (verify:verified-release) rather than re-running the chain.
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'release-please--branches--')
    runs-on: ubuntu-latest
    outputs:
      light: ${{ steps.scope.outputs.light }}
    steps:
      - uses: actions/checkout@v7
        with:
          # release-scope.sh diffs the PR's merge commit against its first parent, the base tip.
          fetch-depth: 2

      # Refs and repository names reach the script through env, never inlined into the shell:
      # a branch name is chosen by whoever opens the PR.
      - name: Release-path scope
        id: scope
        run: bash .github/scripts/release-scope.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}

  gates:
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs verify on Node 24 only for fast feedback; pushes to master and
        # manual (workflow_dispatch) runs verify the full supported matrix
        # ([22, 24]) before anything lands — so a Node-22 regression is still
        # caught pre-merge-to-master while `engines: ">=22"` holds.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[22, 24]') }}
    name: gates (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7
        with:
          # verify:migration-coverage diffs against the last release TAG. A shallow checkout has
          # neither the tag nor the history, and the check errors rather than passing quietly — so
          # this is a precondition, not a nicety.
          fetch-depth: 0

      # A pnpm that does not match this repo's `packageManager` pin writes an `@pnpm/exe` block
      # into the lockfile; a pnpm that DOES match strips it out again. Committed, it makes every
      # correctly-provisioned checkout permanently dirty and drowns real work in `git status`. It was
      # cleaned out of six repos on 2026-09-08 and reappeared in two working trees the same
      # afternoon, so the committed state needs a guard rather than vigilance.
      #
      # The pattern excludes `@pnpm/exe.<platform>` — those are legitimate optional deps of `pnpm`
      # itself and every clean lockfile holds 24 of them, so the obvious grep fails every repo.
      - name: Lockfiles must not carry an @pnpm/exe block
        run: |
          locks=$(git ls-files '*pnpm-lock.yaml')
          if [ -z "$locks" ]; then
            echo "::error::no tracked pnpm-lock.yaml found — this check would pass vacuously"
            exit 1
          fi
          echo "checked $(printf '%s\n' "$locks" | wc -l) tracked lockfile(s)"
          bad=0
          while IFS= read -r f; do
            if grep -qE "@pnpm/exe[^.]" "$f"; then
              echo "::error file=$f::$f carries an @pnpm/exe block, written only by a pnpm that does not match this repo's packageManager pin. Reinstall with the pinned pnpm and commit the lockfile."
              bad=1
            fi
          done <<LOCKS
          $locks
          LOCKS
          exit $bad

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # In-CI verify minus the ecosystem sweep (siblings aren't here).
      # Order: cheap fail-fast → expensive checks last.
      #
      # verify:generated runs first: it re-runs the three code generators in
      # --check mode, so drift between a hand-edited source enum/method and its
      # generated mirror fails here with an explicit "run `pnpm gen:X`" message
      # instead of surfacing later as an opaque conformance/type error. Note it
      # cannot be left to `verify:build` — that invokes rollup directly, and the
      # `prebuild` hook (which regenerates rather than checks) never fires.
      - name: verify:generated
        run: pnpm verify:generated

      - name: verify:types
        run: pnpm verify:types

      - name: verify:lint
        run: pnpm verify:lint

      # Scoped to the TS/JS sources the repo actually keeps formatted, PLUS the
      # markdown under documentation/docs (added 2026-09-18). The .tods.json
      # fixtures under src/tests remain deliberately OUT of scope: reformatting
      # them is a ~40k-line diff across large test corpora and buries their
      # blame for no benefit. `format` carries the same target set, so it and
      # this gate can never disagree.
      #
      # Why documentation/docs joined: nothing checked formatting there, so 19
      # files had been prettier-dirty for a long time invisibly. lint-staged's
      # `*` glob reformats any staged file, so that debt surfaced only when
      # someone touched one of those files -- and then rode out on their
      # unrelated commit. It nearly buried a mechanical link fix under 670
      # removed / 1068 added lines of JSX re-indentation (#4918).
      - name: verify:format
        run: pnpm verify:format

      # P37's REGROWTH GUARD. `matchUpStatusCodes` carried the per-side provenance of a propagated exit
      # as well as the scoring policy's vocabulary; the exit tenant is evicted and `sideExitProvenance`
      # is the record. This fails when a NEW file in `src/` reaches for the array, so the destination is
      # enforceable rather than aspirational.
      #
      # Enumerated HERE as well as in the `verify` chain deliberately: this workflow runs the steps
      # individually rather than invoking `pnpm verify`, so a chain-only entry would be a gate that runs
      # on every developer's machine and never once in CI.
      - name: verify:exit-tenant
        run: pnpm verify:exit-tenant

      # the golden corpus hash manifest: a behaviour change moves a hash, and a moved hash needs
      # a deliberate `pnpm corpus:manifest` in the same PR (CA, 2026-10-01)
      - name: verify:corpus-manifest
        run: pnpm verify:corpus-manifest

      # WIRED IN 2026-09-13, and the `fetch-depth: 0` above was already here FOR it — the checkout
      # comment names this gate by name. It was left out of CI because it read `(#PR)` from the
      # commit subject, which only exists after a squash-merge, so it could never pass on a PR
      # branch. That had two costs: migration-guide coverage was enforced only at `prepublishOnly`,
      # after the fact; and anyone running `pnpm verify` locally hit an unpassable check and worked
      # around it by typing the number into the subject, which the squash then DOUBLED — #4827,
      # #4855 and #4858 all carry `(#NNNN) (#NNNN)` into the 7.0.0 changelog.
      #
      # The script now reads the number from GITHUB_REF on a pull_request build, so it passes on a
      # PR branch and the workaround is unnecessary. Running it here is what makes the gate a gate.
      - name: verify:migration-coverage
        run: pnpm verify:migration-coverage

      - name: verify:attr-audit
        run: pnpm verify:attr-audit

      # Seconds, not minutes, so it stays here rather than in its own job; skipped on a light run like
      # the other test gates.
      - name: verify:server
        if: needs.scope.outputs.light != 'true'
        run: pnpm verify:server

      - name: verify:audit
        run: pnpm verify:audit

      - name: verify:build
        run: pnpm verify:build

      - name: verify:publint
        run: pnpm verify:publint

      - name: verify:runtime
        run: pnpm verify:runtime

      # Reads dist/esm/index.mjs, so it must follow verify:build. Kept in the
      # same position as the `verify` chain (runtime → shakeable → bundle-size).
      - name: verify:shakeable
        run: pnpm verify:shakeable

      - name: verify:bundle-size
        run: pnpm verify:bundle-size

      - name: verify:surface
        run: pnpm verify:surface

      # Needs dist, so it sits after verify:build. Checks that every import the docs tell a
      # reader to write actually resolves against the BUILT package — the documentation tests
      # import by module path and so cannot see a public-surface break.
      - name: verify:docs-imports
        run: pnpm verify:docs-imports

      # The imports check proves the IMPORT resolves; it says nothing about what is then CALLED. A doc
      # can import tournamentEngine correctly and invoke a method that has never existed.
      - name: verify:docs-methods
        run: pnpm verify:docs-methods

      - name: verify:pack
        run: pnpm verify:pack

  # On the path to a release (a PR into master, or a push to master) coverage runs the WHOLE suite
  # under OUTCOME_PIPELINE=differential: every call runs v1 and the v2 outcome pipeline, v2 is
  # measured where it executes, and a divergence between them fails the job. Into dev, v2 is
  # excluded from coverage instead (vitest.config.mts), so building it spends no margin.
  #
  # The suite runs as 4 shards. A shard's own coverage is partial, so vitest.config.mts drops the
  # thresholds on a `--shard` run; the shard fails only on a failing test (a differential divergence
  # is one). Its coverage travels in the blob report to the `coverage` job, which applies them.
  coverage-shard:
    needs: scope
    if: needs.scope.outputs.light != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates` (PRs: [24]; push to master and dispatch: [22, 24])
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[22, 24]') }}
        shard: [1, 2, 3, 4]
    name: coverage shard ${{ matrix.shard }}/4 (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: coverage shard ${{ matrix.shard }}/4
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob
        env:
          OUTCOME_PIPELINE: ${{ (github.base_ref == 'master' || github.ref == 'refs/heads/master') && 'differential' || '' }}

      # `.vitest/blob/blob-<shard>-4.json` (vitest's default); a dot-directory, hence include-hidden-files
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-node${{ matrix.node-version }}-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  coverage:
    needs: [scope, coverage-shard]
    if: needs.scope.outputs.light != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates` (PRs: [24]; push to master and dispatch: [22, 24])
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[22, 24]') }}
    name: coverage (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-blob-node${{ matrix.node-version }}-*
          path: .vitest/blob
          merge-multiple: true

      # The step NAME is load-bearing: scripts/verify/verified-release.mjs accepts a run as proof only
      # if a step named exactly `verify:coverage` succeeded in it. This step is where the thresholds
      # (vitest.config.mts) are applied, to the merged coverage of all 4 shards, so it is the step the
      # name means. It loads the same config, so it needs the same OUTCOME_PIPELINE as the shards: that
      # env decides whether src/mutate/matchUps/outcome/** is in the measured set.
      - name: verify:coverage
        run: |
          count=$(find .vitest/blob -name 'blob-*.json' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 shard blob reports, found $count"
            exit 1
          fi
          pnpm exec vitest run --merge-reports=.vitest/blob --coverage --reporter=default
        env:
          OUTCOME_PIPELINE: ${{ (github.base_ref == 'master' || github.ref == 'refs/heads/master') && 'differential' || '' }}

      # coverage/coverage-summary.json of the merged run, where verify:coverage-headroom reads it.
      # Headroom is not a CI gate (yet); the artifact lets anyone run it against this run's numbers.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-summary-node${{ matrix.node-version }}
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  slow-gates:
    needs: scope
    if: needs.scope.outputs.light != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates` (PRs: [24]; push to master and dispatch: [22, 24])
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[22, 24]') }}
        # stall-budget is the stalled-position RATCHET. Inert on `pnpm test` (it replays all 600
        # exit-propagation matrix cells, which costs about what exitPropagationMatrix itself costs), so
        # this job is the only thing that runs it. Added in the same change as the test, deliberately:
        # a budget nobody runs is worse than no budget.
        gate: [stall-budget, route-differential, deep-corrections]
    name: ${{ matrix.gate }} (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: verify:${{ matrix.gate }}
        run: pnpm verify:${{ matrix.gate }}

  # The check master's branch protection requires is `verify (node 24)`, and this job is it. It
  # passes only when every other job passed, except that on a light run the heavy jobs must have been
  # SKIPPED (any other result, cancelled included, fails it). It runs whatever its needs did, so a red
  # job still produces a red `verify (node N)` rather than a missing one.
  verify:
    needs: [scope, gates, coverage-shard, coverage, slow-gates]
    if: >
      always() && (
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, 'release-please--branches--')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the same Node matrix as `gates` (PRs: [24]; push to master and dispatch: [22, 24])
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('[24]') || fromJSON('[22, 24]') }}
    name: verify (node ${{ matrix.node-version }})

    steps:
      - name: Every verify job passed
        env:
          LIGHT: ${{ needs.scope.outputs.light }}
          SCOPE: ${{ needs.scope.result }}
          GATES: ${{ needs.gates.result }}
          SHARDS: ${{ needs.coverage-shard.result }}
          COVERAGE: ${{ needs.coverage.result }}
          SLOW: ${{ needs.slow-gates.result }}
        run: |
          heavy=success
          if [ "$LIGHT" = true ]; then heavy=skipped; fi
          bad=0
          check() {
            if [ "$2" = "$3" ]; then echo "ok    $1: $2"; else echo "::error::$1: $2 (expected $3)"; bad=1; fi
          }
          check scope "$SCOPE" success
          check gates "$GATES" success
          check coverage-shard "$SHARDS" "$heavy"
          check coverage "$COVERAGE" "$heavy"
          check slow-gates "$SLOW" "$heavy"
          exit $bad
